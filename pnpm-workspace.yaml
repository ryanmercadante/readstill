packages:
  - apps/*
  - packages/*
  - tooling/*

allowBuilds:
  esbuild: true
  workerd: true
# Preserve versions from the npm lockfile during the 2026-11-14 migration.
# These exact-version exceptions can be removed after 2026-11-14 22:45 UTC,
# when all listed releases are older than pnpm's default one-day minimum.
minimumReleaseAgeExclude:
  - "@playwright/test@1.65.1"
  - "@rolldown/pluginutils@1.1.1"
  - framer-motion@14.14.0
  - motion-dom@14.14.0
  - motion@14.14.0
  - node-releases@2.0.64
  - playwright-core@1.65.1
  - playwright@1.65.1
  - postcss@8.5.33
  - tapable@2.3.4
permissions:
  "@tanstack/devtools-vite":
    skills: true
  "@tanstack/react-router":
    skills: [router-query, react-router]
  "@tanstack/react-start":
    skills: [react-start]
skills:
  dirs:
    - .agents/skills
