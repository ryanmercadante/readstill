name: Set up and install
description: Install Node and pnpm, then install workspace dependencies from the lockfile.

# Local actions load from the checked-out tree, so run actions/checkout first:
#   - uses: actions/checkout@v7.0.1
#   - uses: ./tooling/github/setup

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7.1.0
      with:
        node-version: 24
    - uses: pnpm/action-setup@v6.1.1
      with:
        cache: true
    - shell: bash
      run: pnpm install --frozen-lockfile
