name: Set up and install
description: Install Node and pnpm, then install workspace dependencies from the lockfile.

# Reference it as `$/` so it runs at the workflow's commit and the actions it
# uses are covered by .github/workflows/actions.lock. It reads .nvmrc and the
# pnpm lockfile from the workspace, so run actions/checkout first:
#   - uses: actions/checkout@v7.0.1
#   - uses: $/tooling/github/setup

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7.1.0
      with:
        node-version-file: .nvmrc
    - uses: pnpm/action-setup@v6.1.1
      with:
        cache: true
    - shell: bash
      run: pnpm install --frozen-lockfile
