name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  staging:
    # After tests pass on main, upload a staging version with its own preview
    # URL. It doesn't receive production traffic; releases do that.
    needs: test
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # Needs its own copy of the Cloudflare secrets.
    environment: staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Check for a first release
        id: released
        # Version uploads need an existing Worker, which the first release creates.
        run: |
          if git ls-remote --exit-code --tags origin 'refs/tags/v*' > /dev/null; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No release yet, so the Worker doesn't exist. Skipping the staging upload."
          fi
      - uses: actions/setup-node@v6
        if: ${{ steps.released.outputs.yes }}
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        if: ${{ steps.released.outputs.yes }}
        with:
          cache: true
      - if: ${{ steps.released.outputs.yes }}
        run: pnpm install --frozen-lockfile
      - if: ${{ steps.released.outputs.yes }}
        run: pnpm build
      - name: Upload staging version
        if: ${{ steps.released.outputs.yes }}
        run: >-
          pnpm exec wrangler versions upload
          --tag "${GITHUB_SHA::7}"
          --message "$(git log -1 --format=%s | cut -c1-100)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
