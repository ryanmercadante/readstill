name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./tooling/github/setup
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm --filter @still/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14

  staging:
    # After tests pass on main, deploy the separate readstill-staging Worker
    # to staging.readstill.app. Production only moves on a release.
    needs: test
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # Needs its own copy of the Cloudflare secrets.
    environment:
      name: staging
      url: https://staging.readstill.app
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./tooling/github/setup
      # The Vite plugin selects the wrangler environment at build time.
      - run: pnpm build
        env:
          CLOUDFLARE_ENV: staging
      - name: Deploy to staging
        working-directory: apps/web
        run: pnpm exec wrangler deploy --message "$(git log -1 --format=%s | cut -c1-100)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
